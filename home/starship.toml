"$schema" = "https://starship.rs/config-schema.json"

# Icons are Nerd Font glyphs (U+E0A0 powerline / U+F000 font-awesome ranges).
# The terminal is set to 0xProto Nerd Font Mono for this to render.
format = "$os$username$directory$git_branch$git_status$nodejs$bun$python$java$golang$rust$cmd_duration$status$character"
add_newline = false
command_timeout = 1000

[os]
disabled = false
style = "cyan"
# default is a colour emoji; U+F300 (Tux) keeps the prompt monochrome
symbols = { "Zorin" = "\uF300 ", "Linux" = "\uF300 ", "Unknown" = "\uF300 " }

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "

[directory]
# This starship version has no `symbol` key, so the icon is inline in the
# format string. U+F07C = Nerd Font folder.
format = "[\uF07C $path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " ro"
read_only_style = "bold red"
truncation_length = 3
truncate_to_repo = true

[directory.substitutions]
"Documents" = " 󰈙 "
"Downloads" = " 󰇚 "
"Music" = " 󰝚 "
"Pictures" = " 󰍉 "
"src" = " 󰉋 "

[git_branch]
symbol = "  "
style = "bold purple"
format = "on [$symbol$branch(:$remote_branch)]($style) "
only_attached = false

[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = "  "
style = "bold green"
format = "via [$symbol($version )]($style)"

[bun]
symbol = "  "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[python]
symbol = "  "
style = "bold blue"
format = "via [$symbol($version )]($style)"

[java]
symbol = "  "
style = "bold magenta"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "  "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "  "
style = "bold red"
format = "via [$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[status]
# no `error_symbol` in this version: `symbol` covers the failure case
style = "bold"
format = "[$symbol$status]($style) "
symbol = "[✗]($style)"
success_symbol = "[✓]($style)"
pipestatus = true
pipestatus_format = "[$pipestatus]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[time]
disabled = false
format = " [$time](bold blue)"
time_format = "%H:%M"
